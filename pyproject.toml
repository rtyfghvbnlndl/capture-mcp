[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "capture-mcp"
version = "0.1.3"
readme = "README.md"
description = "MCP server that exposes a USB HDMI capture card (UVC camera) as a screen for vision LLMs"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "zumg" }]

dependencies = [
    "mcp>=1.10",
    "opencv-python-headless>=4.8",
    "numpy",
]

[project.optional-dependencies]
enum = ["cv2-enumerate-cameras"]
# read_screen: the OCR built into Windows on Windows (fast, no model download), RapidOCR elsewhere
ocr = [
    "winrt-runtime>=3; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=3; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=3; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3; sys_platform == 'win32'",
    "rapidocr>=3; sys_platform != 'win32'",
    "onnxruntime; sys_platform != 'win32'",
]
# RapidOCR on any platform (also on Windows, e.g. when the Windows OCR language pack is missing)
ocr-rapid = ["rapidocr>=3", "onnxruntime"]
dev = ["pytest"]

[project.scripts]
capture-mcp = "capture_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/rtyfghvbnlndl/capture-mcp"

[tool.setuptools]
packages = ["capture_mcp"]
